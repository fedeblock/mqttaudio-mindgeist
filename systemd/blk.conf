# Drop-in de systemd para mqttaudio.service
#
# Instalación (en la Raspberry Pi):
#   sudo install -D -m 644 systemd/blk.conf /etc/systemd/system/mqttaudio.service.d/blk.conf
#   sudo systemctl daemon-reload && sudo systemctl restart mqttaudio
#
# No sustituye la unidad existente: solo añade variables de entorno.
#
# El fichero de secretos vive fuera del repositorio, con permisos 600:
#   ~/.config/blk/secrets.env
# Formato systemd: una línea CLAVE=valor por variable, sin "export" ni comillas
# innecesarias. mqttaudio lee ELEVENLABS_API_KEY:
#   ELEVENLABS_API_KEY=...
#
# Credenciales MQTT de ESTE servicio (solo con un broker que exija autenticación, Fase 1 de BLK v2),
# en su propio fichero con permisos 600: ~/.config/blk/mqtt-mqttaudio.env
#   MQTT_USERNAME=mqttaudio
#   MQTT_PASSWORD=...
# Cada servicio tiene su usuario y su contraseña: el ACL del broker depende de ello.
#
# El guion de "-/home/..." hace que la unidad arranque aunque el fichero no exista
# (entonces elevenlabs_tts se rechaza con un mensaje claro en el journal).
# Ajusta la ruta si el servicio no corre como el usuario "pi".
[Service]
EnvironmentFile=-/home/pi/.config/blk/secrets.env
EnvironmentFile=-/home/pi/.config/blk/mqtt-mqttaudio.env
